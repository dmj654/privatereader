name: Diagnose Methods

# 第二层定位：把 ReaderStyleTests 按方法拆开，找出具体卡死的那一个。
on:
  workflow_dispatch:

jobs:
  methods:
    name: ${{ matrix.method }}
    runs-on: macos-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        method:
          - testNormalizedBodyCollapsesBlankLinesWithoutPadding
          - testIndentWidthFollowsFontSize
          - testParagraphStyleReflectsIndentAndAlignment
          - testLetterSpacingBecomesKern
          - testFontResolutionFallsBackInsteadOfFailing
          - testAttributesCarryFontAndColor
    steps:
      - uses: actions/checkout@v4
      - name: 运行 ${{ matrix.method }}
        run: |
          set -o pipefail
          swift test --package-path ReaderCore --filter 'ReaderStyleTests/${{ matrix.method }}' 2>&1 | tail -30
